<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CS2 多地图战术库 (Ultimate Edition V6)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121212; --sidebar-bg: #1E1E1E; --border-color: #333; --text-color: #E0E0E0;
            --accent-color: #FF9800; --input-bg: #2A2A2A; --danger-color: #E53935;
            --ios-blur: rgba(30, 30, 30, 0.75);
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-color); overflow: hidden; height: 100dvh; display: flex; touch-action: none; }

        .global-toolbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--ios-blur); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .toolbar-logo { font-size: 18px; font-weight: bold; color: var(--accent-color); margin-right: 20px; white-space: nowrap; }
        .toolbar-search { flex: 1; max-width: 450px; position: relative; margin: 0 20px; display: flex; flex-direction: column; }
        .toolbar-search input { width: 100%; padding: 8px 16px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 30px; font-size: 14px; outline: none; transition: border 0.2s; }
        .toolbar-search input:focus { border-color: var(--accent-color); }
        
        .toolbar-search-btn { display: none; padding: 8px 14px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 12px; cursor: pointer; font-size: 16px; }
        
        .mobile-search-overlay { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1500; flex-direction: column; padding: 16px; }
        .mobile-search-overlay.active { display: flex; }
        .mobile-search-header { display: flex; gap: 10px; margin-bottom: 12px; }
        .mobile-search-header input { flex: 1; padding: 10px 16px; background: var(--input-bg); border: 1px solid var(--accent-color); color: var(--text-color); border-radius: 30px; font-size: 15px; outline: none; }
        .mobile-search-header button { padding: 10px 16px; background: #444; border: none; color: #fff; border-radius: 12px; cursor: pointer; font-size: 14px; }
        .mobile-search-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        #global-search-dropdown { display: none; position: absolute; top: calc(100% + 10px); left: 0; width: 100%; max-height: 70vh; overflow-y: auto; z-index: 2000; background: rgba(35, 35, 35, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid #555; border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.8); padding: 16px; }
        .global-search-title { color: var(--accent-color); margin-bottom: 12px; font-size: 14px; font-weight: bold; padding: 0 8px; }
        .global-search-container { display: flex; flex-direction: column; gap: 6px; }
        .global-search-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.15s; }
        .global-search-item:hover, .global-search-item.focused { border-color: var(--accent-color); background: rgba(255,152,0,0.1); transform: translateX(2px); }
        .global-search-item .map-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 12px; color: #fff; width: 110px; }
        .global-search-item .map-badge img { width: 16px; height: 16px; border-radius: 2px; }
        .global-search-item .ut-icon { width: 36px; height: 36px; object-fit: contain; } 
        .global-search-item .ut-info { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .global-search-item .ut-name { font-size: 15px; font-weight: bold; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

        .toolbar-buttons { display: flex; gap: 10px; margin-left: auto; align-items: center; }
        .toolbar-btn { padding: 8px 16px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 12px; cursor: pointer; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .toolbar-btn:hover { background: #333; }
        .toolbar-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }
        .file-input-hide { position: absolute; width: 1px; height: 1px; opacity: 0; z-index: -1; }

        #home-view { display: flex; flex-direction: column; width: 100%; height: 100dvh; padding-top: 60px; overflow-y: auto; }
        .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 30px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .map-card { background: var(--input-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); transition: all 0.25s; cursor: pointer; aspect-ratio: 10/14; position: relative; }
        .map-card:hover { transform: translateY(-4px); border-color: var(--accent-color); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .card-bg { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.75; }
        .card-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50%; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9)); }
        .card-name { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: bold; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); padding: 25px 10px 15px; }

        #map-view { display: none; flex: 1; position: relative; padding-top: 60px; height: 100dvh; }
        #sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; height: calc(100dvh - 60px); transition: transform 0.3s ease; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 18px; color: var(--accent-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-controls { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .sidebar-controls input { width: 100%; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; outline: none; font-size: 13px; }
        .filters { display: flex; align-items: center; justify-content: flex-end; font-size: 13px; color: #aaa; }
        .fav-filter { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
        .fav-filter input { accent-color: var(--accent-color); }
        
        .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .list-item { padding: 10px 14px; background: var(--input-bg); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid transparent; }
        .list-item:hover, .list-item.focused { background: #2a2a2a; border-color: #555; }
        .list-item .item-main { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .list-item .icon-img { width: 42px; height: 42px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); } 
        .list-item .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .fav-star-btn { background: none; border: none; font-size: 18px; color: #555; cursor: pointer; padding: 4px; transition: 0.2s; width: 28px; height: 28px; }
        .fav-star-btn:hover { transform: scale(1.2); color: #888; }
        .fav-star-btn.is-fav { color: #FFCC00; }

        #map-container { flex: 1; position: relative; overflow: hidden; background: #0b0b0b; cursor: grab; touch-action: none; }
        #map-container.grabbing { cursor: grabbing; }
        #map-wrapper { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
        #dust2-map { display: block; -webkit-user-drag: none; pointer-events: none; }
        
        #trajectory-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
        .traj-group { opacity: 0; transition: opacity 0.4s ease; }
        .traj-group.show { opacity: 1; }
        
        #points-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .point-wrapper { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; transition: opacity 0.2s; }
        .map-point { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid white; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; transition: transform 0.15s ease, box-shadow 0.3s; position: relative; overflow: visible; }
        .point-wrapper:hover .map-point, .point-wrapper.touch-hovered .map-point { transform: scale(1.15); z-index: 20; box-shadow: 0 0 0 4px rgba(255,152,0,0.5); }
        .point-icon { width: 52px; height: 52px; object-fit: contain; pointer-events: none; position: absolute; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); } 

        .land-wrapper { position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; transition: opacity 0.2s; z-index: 8;}
        .map-land { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.8); transition: transform 0.15s ease; }
        .land-wrapper:hover .map-land, .land-wrapper.touch-hovered .map-land { transform: scale(1.3); z-index: 20; }
        
        @keyframes pulse-highlight { 0% { box-shadow: 0 0 0 0px rgba(255, 152, 0, 0.9); border-color: #FF9800; transform: scale(1.3); } 50% { box-shadow: 0 0 0 25px rgba(255, 152, 0, 0); border-color: white; transform: scale(1); } 100% { box-shadow: 0 0 0 0px rgba(255, 152, 0, 0); border-color: white; transform: scale(1); } }
        .ping-anim .map-point, .ping-anim .map-land { animation: pulse-highlight 2s cubic-bezier(0.1, 0.8, 0.3, 1); z-index: 25; }

        .top-right-filters { position: absolute; top: 16px; right: 16px; background: rgba(25px, 25px, 25px, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 18px; z-index: 50; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .filter-row { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; } 
        .filter-row label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: #ccc; }
        .filter-row img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); } 
        .filter-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .divider { height: 1px; background: var(--border-color); width: 100%; }

        .fab-add { position: absolute; bottom: 30px; right: 30px; width: 56px; height: 56px; border-radius: 28px; background: var(--accent-color); color: #000; border: none; cursor: pointer; box-shadow: 0 6px 16px rgba(255, 152, 0, 0.3); z-index: 40; transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
        .fab-add svg { width: 26px; height: 26px; fill: none; stroke: #000; stroke-width: 2.5; stroke-linecap: round; }
        .fab-add:hover { transform: scale(1.05); }

        .fab-sidebar { display: none; position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 8px; background: rgba(30,30,30,0.85); backdrop-filter: blur(10px); border: 1px solid var(--border-color); color: #fff; font-size: 20px; cursor: pointer; z-index: 40; align-items: center; justify-content: center; }

        #aim-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 45; touch-action: none; pointer-events: none; flex-direction: column; align-items: center; justify-content: space-between; padding: max(20px, var(--safe-top)) 0 max(20px, var(--safe-bottom)); }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); pointer-events: none !important; z-index: 46; }
        #crosshair div:nth-child(1) { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--accent-color); transform: translateY(-50%); }
        #crosshair div:nth-child(2) { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent-color); transform: translateX(-50%); }
        #crosshair div:nth-child(3) { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-color); transform: translate(-50%, -50%); box-shadow: 0 0 8px var(--accent-color); }
        #aim-radius-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px dashed var(--accent-color); background: rgba(255,152,0,0.1); border-radius: 50%; pointer-events: none; display: none; z-index: 45; }
        .aim-hint { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .aim-controls { display: flex; gap: 12px; width: 90%; max-width: 500px; pointer-events: auto !important; flex-wrap: wrap; justify-content: center; }
        .aim-btn { flex: 1; min-width: 100px; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #aim-confirm, #aim-path-confirm { background: var(--accent-color); color: #000; }
        #aim-cancel, #aim-path-cancel { background: rgba(255,255,255,0.15); color: #fff; }
        #aim-path-add { background: #444; color: #fff; }
        #aim-path-reset { background: var(--danger-color); color: #fff; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #modal-add { z-index: 2100; } 
        .modal-window { background: var(--sidebar-bg); border-radius: 16px; width: 92vw; max-width: 640px; max-height: 88dvh; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .window-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .window-header h2 { font-size: 18px; color: var(--accent-color); }
        .window-close { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; transition: color 0.2s; }
        .window-close:hover { color: #fff; }
        .window-body { padding: 20px; overflow-y: auto; flex: 1; }
        .window-footer { padding: 14px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; background: #181818; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; font-weight: 500; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; }
        .type-selector { display: flex; gap: 12px; background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .type-selector label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; color: #ccc; margin: 0; }
        .type-selector img { width: 44px; height: 44px; object-fit: contain; } 
        .color-traj-row { display: flex; gap: 16px; align-items: flex-end; }
        .color-traj-row .form-group { margin-bottom: 0; }
        .btn-form-action { background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: #fff; padding: 0 16px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;}
        .btn-form-action:hover { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight:bold; }

        .bucket-section { margin-bottom: 20px; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; background: #252525; transition: border-color 0.2s; }
        .bucket-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: var(--accent-color); }
        .bucket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; min-height: 80px; }
        .img-slot { aspect-ratio: 16/9; border: 2px dashed #555; border-radius: 8px; background: var(--input-bg); color: #888; display: flex; align-items: center; justify-content: center; cursor: pointer; background-size: cover; background-position: center; font-size: 12px; text-align: center; position: relative; transition: 0.2s; }
        .img-slot:hover { border-color: var(--accent-color); }
        .img-slot.is-main { border: 2px solid var(--accent-color); border-style: solid; }
        .img-slot.is-main::before { content: '主'; position: absolute; top: 4px; left: 4px; background: var(--accent-color); color: black; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; z-index: 2; }
        .img-slot .del-img { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; background: var(--danger-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; opacity: 0; transition: 0.2s; z-index: 3; border: none; }
        .img-slot:hover .del-img { opacity: 1; }

        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; min-height: 40px; }
        .tag-capsule { background: rgba(255,152,0,0.15); color: var(--accent-color); border: 1px solid rgba(255,152,0,0.3); padding: 4px 10px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .tag-close { cursor: pointer; font-weight: bold; color: #888; }
        #input-tag-helper { border: none; padding: 4px; flex: 1; min-width: 60px; background: transparent; color: #fff; outline: none; }

        .detail-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 20px;}
        .detail-meta { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .detail-actions-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-action-primary { padding: 8px 16px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .btn-action-primary:hover { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .btn-action-fav { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; cursor: pointer; background: transparent; transition: 0.2s; color: #888;}
        .btn-action-fav:hover { background: #333; }
        .btn-action-fav.is-fav { color: #FFCC00; border-color: #FFCC00; background: rgba(255, 204, 0, 0.1); }
        .btn-action-delete { padding: 8px 16px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-action-delete:hover { background: var(--danger-color); color: #fff; }
        
        .image-category { margin-bottom: 28px; }
        .category-title { font-size: 16px; font-weight: bold; color: var(--accent-color); margin-bottom: 12px; }
        .detail-media-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: pan-y;}
        .detail-media-box img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; pointer-events: none; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 24px; padding: 10px; cursor: pointer; z-index: 5; border-radius: 4px; }
        .nav-btn:hover { background: var(--accent-color); color: black; }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; background: rgba(0,0,0,0.6); color: white;}
        .nav-left { left: 10px; } .nav-right { right: 10px; }

        .thumb-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
        .thumb-item { flex-shrink: 0; width: 120px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.6; transition: 0.2s; background: #000; scroll-snap-align: start; position: relative; }
        .thumb-item.active { border-color: var(--accent-color); opacity: 1; }
        .thumb-item.is-main::before { content: '主'; position: absolute; top: 2px; left: 2px; background: var(--accent-color); color: #000; font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: bold; z-index: 2; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 16px; background: #000; border: 1px solid var(--border-color);}
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

        .btn-cancel { padding: 10px 20px; background: #444; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn-submit { padding: 10px 20px; background: var(--accent-color); color: black; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-alt { padding: 10px 20px; background: #444; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-alt:hover { background: #555; }

        #fullscreen-viewer { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index: 3000; justify-content:center; align-items:center; cursor:grab; overflow:hidden;}
        #fullscreen-viewer:active { cursor: grabbing; }
        #fullscreen-img { max-width:100%; max-height:100%; object-fit:contain; transition: transform 0.1s; transform-origin: center center; pointer-events: none; }
        .fs-close { position:absolute; top:20px; right:20px; color:#fff; font-size:30px; cursor:pointer; background:rgba(255,255,255,0.2); width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center; z-index: 3010; border: none; }
        .fs-close:hover { background: var(--danger-color); }

        #drop-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; border: 3px dashed var(--accent-color); backdrop-filter: blur(4px); }
        #drop-overlay h2 { color: var(--accent-color); pointer-events: none; }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .toolbar-search { display: none !important; }
            .toolbar-search-btn { display: flex !important; }
            .toolbar-logo { display: none; }
            .toolbar-buttons { gap: 6px; }
            .toolbar-btn { padding: 6px 10px; font-size: 12px; }
            body { flex-direction: column; }
            #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 85%; max-width: 320px; transform: translateX(-100%); z-index: 500; box-shadow: 5px 0 15px rgba(0,0,0,0.5); height: calc(100dvh - 60px); }
            #sidebar.open { transform: translateX(0); }
            .fab-sidebar { display: flex !important; }
            .modal-window { width: 100% !important; max-width: 100% !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; }
            .top-right-filters { top: 10px; right: 10px; padding: 10px 12px; gap: 8px; }
            .filter-row img { width: 32px; height: 32px; }
            .filter-row label { font-size: 13px; gap: 6px; }
            .aim-controls { width: 95%; gap: 8px; }
            .aim-btn { padding: 12px 8px; font-size: 13px; min-width: 80px; }
            .detail-header-row { flex-direction: column; gap: 12px; }
            .detail-actions-group { width: 100%; justify-content: flex-start; }
            .map-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px; }
        }
    </style>
</head>
<body>

        <div class="toolbar-buttons">
            <button class="toolbar-btn active" id="btn-home">🗺️ 看板</button>

                <button id="btn-export-folder" class="btn-submit" style="padding: 16px; font-size: 15px; height: auto;">📁 文件夹结构 ZIP<br><span style="font-size: 12px; font-weight: normal; color: #333; display: block; margin-top: 4px;">(推荐：图片与视频独立存放)</span></button>
                <button id="btn-export-json" class="btn-alt" style="padding: 16px; font-size: 15px; height: auto;">📄 单体 JSON 模式<br><span style="font-size: 12px; font-weight: normal; color: #ccc; display: block; margin-top: 4px;">(兼容版：所有数据在一个文件内)</span></button>

                <form id="form-utility">

                    <div class="form-group"><label>简介</label><textarea id="input-desc" rows="3" placeholder="描述用途..."></textarea></div>
                    <div class="form-group"><label>道具类型</label>

                    <div class="form-group"><label>分类标签 (回车添加)</label>
                        <div class="tag-container" id="tag-box-wrapper"><input type="text" id="input-tag-helper" placeholder="+ 标签..." autocomplete="off"></div>
                    </div>
                    <input type="file" id="finput-lineup" class="file-input-hide" multiple accept="image/*">
                    <input type="file" id="finput-throw" class="file-input-hide" multiple accept="image/*">
                    <input type="file" id="finput-effect" class="file-input-hide" multiple accept="image/*">
                    <div class="bucket-section" data-bucket="lineup"><div class="bucket-title">📍 站位截图</div><div class="bucket-grid" id="grid-lineup"></div><div class="img-slot btn-add-img" onclick="document.getElementById('finput-lineup').click()" style="margin-top:12px;">+ 添加 / 拖入图片</div></div>
                    <div class="bucket-section" data-bucket="throw"><div class="bucket-title">🤚 出手截图</div><div class="bucket-grid" id="grid-throw"></div><div class="img-slot btn-add-img" onclick="document.getElementById('finput-throw').click()" style="margin-top:12px;">+ 添加 / 拖入图片</div></div>
                    <div class="bucket-section" data-bucket="effect"><div class="bucket-title">💥 效果截图</div><div class="bucket-grid" id="grid-effect"></div><div class="img-slot btn-add-img" onclick="document.getElementById('finput-effect').click()" style="margin-top:12px;">+ 添加 / 拖入图片</div></div>
                    <div class="bucket-section" data-bucket="video"><div class="bucket-title">📹 视频演示 (MP4)</div><input type="file" id="input-video" accept="video/mp4" style="font-size:13px; margin-bottom: 8px;"><div id="video-preview-status" style="font-size:13px; color:#aaa;"></div></div>

            </div>

                <button type="button" class="btn-cancel" id="btn-form-cancel">取消 (Esc)</button>

    <div id="modal-detail" class="modal">
        <div class="modal-window">
            <div class="window-header"><h2 id="detail-modal-title">道具详情</h2><button class="window-close" id="btn-close-detail">&times;</button></div>
            <div class="window-body">
                <div class="detail-header-row">
                    <div class="detail-meta">
                        <h2 id="detail-name" style="color:#fff; font-size:24px; font-weight:bold;">道具名称</h2>
                        <div class="detail-tags" id="detail-tags-list"></div>
                    </div>
                    <div class="detail-actions-group">
                        <button class="btn-action-primary" id="btn-edit-current">⚙️ 编辑</button>
                        <button class="btn-action-fav" id="btn-detail-fav">☆ 收藏</button>
                        <button class="btn-action-delete" id="btn-delete-current">🗑️ 删除</button>
                    </div>
                </div>
                <p id="detail-desc" style="color:#ccc; font-size:15px; line-height:1.6; margin-bottom:24px; white-space:pre-wrap; user-select:text;">暂无简介</p>
                <div id="detail-video-container" style="display:none;"><div class="category-title">📹 视频演示</div><div class="video-container"><video id="detail-video" controls loop autoplay muted playsinline></video></div></div>
                <div class="image-category" id="sec-detail-lineup"><div class="category-title">📍 站位视角</div><div class="detail-media-box" data-swipe="lineup"><button class="nav-btn nav-left" id="nav-l-lineup">‹</button><img id="main-detail-lineup" src=""><button class="nav-btn nav-right" id="nav-r-lineup">›</button></div><div class="thumb-nav" id="thumbs-detail-lineup"></div></div>
                <div class="image-category" id="sec-detail-throw"><div class="category-title">🤚 出手瞬间</div><div class="detail-media-box" data-swipe="throw"><button class="nav-btn nav-left" id="nav-l-throw">‹</button><img id="main-detail-throw" src=""><button class="nav-btn nav-right" id="nav-r-throw">›</button></div><div class="thumb-nav" id="thumbs-detail-throw"></div></div>
                <div class="image-category" id="sec-detail-effect"><div class="category-title">💥 最终效果</div><div class="detail-media-box" data-swipe="effect"><button class="nav-btn nav-left" id="nav-l-effect">‹</button><img id="main-detail-effect" src=""><button class="nav-btn nav-right" id="nav-r-effect">›</button></div><div class="thumb-nav" id="thumbs-detail-effect"></div></div>
            </div>

    <div id="fullscreen-viewer"><button class="fs-close" id="btn-fs-close">&times;</button><img id="fullscreen-img" src=""></div>
    <div id="drop-overlay"><h2>正在解析数据，请稍候...</h2></div>

<script>
    const TYPE_ICONS = { smoke: 'icons/烟.webp', flash: 'icons/闪.webp', he: 'icons/雷.webp', molotov: 'icons/火.webp' };
    const DEFAULT_COLORS = { smoke: '#4D90FE', flash: '#B0BEC5', molotov: '#FF9800', he: '#E53935' };
    const DEFAULT_RADIUS = { smoke: 0.045, he: 0.035, molotov: 0.04, flash: 0 };
    
    let maps = []; let currentMap = null; let allUtilities = {}; 
    let isAiming = false; let aimMode = 'throw'; 
    let tempPoint = { x: 50, y: 50 }; let tempPath = []; 
    let hoveredItemId = null;
    let editingTrajectoryId = null;
    let scale = 1, tx = 0, ty = 0;
    let isDragging = false, hasDragged = false, dragStartX, dragStartY;
    let activeSearchIndex = -1;
    let activeTags = []; let formBuckets = { lineup: [], throw: [], effect: [] }; let formVideoBase64 = null;
    const historyStack = []; const forwardStack = [];
    let detailSwipeState = { startX: 0, startY: 0, cat: null };
    
    // ✅ Bug3：移动端触控状态
    let isTouchDevice = false;
    let touchHoveredId = null;
    let singleTouchMoved = false;

    async function init() {
        isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        try { const res = await fetch('manifest.json'); if (res.ok) { maps = (await res.json()).map(m => ({...m, effectRadius: m.effectRadius || DEFAULT_RADIUS})); } else throw new Error(); } 
        catch (e) { maps = [{ id:"dust2", name:"炙热沙城II", logo:"maps/dust2/CS2_dust2_logo.webp", remake:"maps/dust2/CS2_dust2_remake.webp", radar:"maps/dust2/CS2_dust2_radar.webp", effectRadius:DEFAULT_RADIUS },{ id:"inferno", name:"炼狱小镇", logo:"maps/inferno/CS2_inferno_logo.webp", remake:"maps/inferno/CS2_inferno_remake.webp", radar:"maps/inferno/CS2_inferno_radar.webp", effectRadius:DEFAULT_RADIUS }]; }
        maps.forEach(m => { if(!allUtilities[m.id]) allUtilities[m.id] = []; });
        document.querySelectorAll('input[name="utype"]').forEach(radio => { radio.addEventListener('change', (e) => { document.getElementById('input-color').value = DEFAULT_COLORS[e.target.value]; updateAimRadiusCircle(); }); });
        setupImportExportEngine(); renderMapGrid(); setupGlobalSearch(); setupMapEngine(); setupFormInteraction(); setupHotkeys(); setupFullscreenViewer(); setupDetailSwipe();
        document.querySelectorAll('.modal').forEach(modal => { modal.addEventListener('click', (e) => { if (e.target === modal) executeBackAction(); }); });
        document.getElementById('btn-toggle-sidebar').onclick = (e) => { e.stopPropagation(); document.getElementById('sidebar').classList.toggle('open'); };
        document.getElementById('map-container').addEventListener('click', () => { if(document.getElementById('sidebar').classList.contains('open')) document.getElementById('sidebar').classList.remove('open'); });
    }

    function setupImportExportEngine() {
        document.getElementById('btn-export-trigger').onclick = () => document.getElementById('modal-export').style.display = 'flex';
        document.getElementById('btn-export-folder').onclick = () => runExport(true);
        document.getElementById('btn-export-json').onclick = () => runExport(false);
        document.getElementById('btn-import-trigger').onclick = () => document.getElementById('file-import-input').click();
        document.getElementById('file-import-input').onchange = async (e) => { if(e.target.files[0]) await handleImportFile(e.target.files[0]); e.target.value = ''; };
        let dragCounter = 0;
        window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; if (e.target.closest('.modal-window')) return; if (e.dataTransfer?.types.includes('Files')) document.getElementById('drop-overlay').style.display = 'flex'; });
        window.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; document.getElementById('drop-overlay').style.display = 'none'; } });
        window.addEventListener('drop', async (e) => { e.preventDefault(); dragCounter = 0; document.getElementById('drop-overlay').style.display = 'none'; if (e.target.closest('.modal-window')) return; if (e.dataTransfer.files.length > 0) await handleImportFile(e.dataTransfer.files[0]); });
    }

    async function runExport(isFolderMode) {
        const btn = isFolderMode ? document.getElementById('btn-export-folder') : document.getElementById('btn-export-json');
        const origHtml = btn.innerHTML; btn.innerHTML = `⏳ 正在打包...`;
        setTimeout(() => {
            if (!isFolderMode) { const blob = new Blob([JSON.stringify(allUtilities, null, 2)], { type: "application/json" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `CS2_Tactics_${new Date().toISOString().slice(0,10)}.json`; link.click(); URL.revokeObjectURL(link.href); btn.innerHTML = origHtml; document.getElementById('modal-export').style.display = 'none'; return; }
            const zip = new JSZip(); const exportData = JSON.parse(JSON.stringify(allUtilities));
            for (const mapId in exportData) { exportData[mapId].forEach(item => { ['lineup','throw','effect'].forEach(bType => { if(item.buckets?.[bType]) { item.buckets[bType] = item.buckets[bType].map((b64, idx) => { const m = b64.match(/^data:(image\/\w+);base64,(.+)$/); if(m) { const ext=m[1].split('/')[1]||'png'; const path=`${mapId}/images/${item.id}_${bType}_${idx}.${ext}`; zip.file(path,m[2],{base64:true}); return path; } return b64; }); } }); if(item.video) { const m=item.video.match(/^data:(video\/\w+);base64,(.+)$/); if(m) { const ext=m[1].split('/')[1]||'mp4'; const path=`${mapId}/videos/${item.id}.${ext}`; zip.file(path,m[2],{base64:true}); item.video=path; } } }); }
            zip.file("data.json", JSON.stringify(exportData, null, 2));
            zip.generateAsync({ type: "blob" }).then((content) => { const link = document.createElement("a"); link.href = URL.createObjectURL(content); link.download = `CS2_Tactics_${new Date().toISOString().slice(0,10)}.zip`; link.click(); btn.innerHTML = origHtml; document.getElementById('modal-export').style.display = 'none'; });
        }, 50);
    }

    async function handleImportFile(f) {
        document.getElementById('drop-overlay').style.display = 'flex';
        try {
            let importedData = null;
            if (f.name.endsWith('.json')) { importedData = JSON.parse(await f.text()); } 
            else if (f.name.endsWith('.zip')) { const zip = await JSZip.loadAsync(f); const djf = zip.file("data.json"); if(!djf) { alert("未找到 data.json"); return; } importedData = JSON.parse(await djf.async("string")); for(const mid in importedData) { for(const item of importedData[mid]) { if(item.buckets) { for(const bt of ['lineup','throw','effect']) { if(item.buckets[bt]) { for(let i=0;i<item.buckets[bt].length;i++) { const p=item.buckets[bt][i]; if(p&&!p.startsWith('data:')) { const file=zip.file(p); if(file) { const b64=await file.async("base64"); const ext=p.split('.').pop()||'png'; item.buckets[bt][i]=`data:image/${ext};base64,${b64}`; } } } } } } if(item.video&&!item.video.startsWith('data:')) { const file=zip.file(item.video); if(file) { const b64=await file.async("base64"); const ext=item.video.split('.').pop()||'mp4'; item.video=`data:video/${ext};base64,${b64}`; } } } } } 
            else { alert("仅支持 .zip 或 .json"); return; }
            let mc = 0; Object.keys(importedData).forEach(mid => { if(!allUtilities[mid]) allUtilities[mid]=[]; const eids=new Set(allUtilities[mid].map(u=>u.id)); importedData[mid].forEach(item => { if(!eids.has(item.id)) { allUtilities[mid].push(item); eids.add(item.id); mc++; } }); });
            if(currentMap) buildMapDOM(); alert(`✅ 导入成功！新增 ${mc} 个道具。`);
        } catch(err) { alert("解析失败"); } finally { document.getElementById('drop-overlay').style.display = 'none'; }
    }

    function createUIStateSnapshot() { return { view: document.getElementById('home-view').style.display==='none'?'map':'home', mapId: currentMap?.id||null, tx, ty, scale, isAiming, aimMode, tempPoint:{...tempPoint}, tempPath:[...tempPath], isFormOpen: document.getElementById('modal-add').style.display==='flex', formId: document.getElementById('edit-id').value, isDetailOpen: document.getElementById('modal-detail').style.display==='flex', detailId: document.getElementById('modal-detail').dataset.itemId, touchHoveredId }; }

    function restoreUIState(s) {
        document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); document.getElementById('aim-overlay').style.display='none'; editingTrajectoryId=null;
        touchHoveredId = s.touchHoveredId || null;
        if(s.view==='home') { document.getElementById('home-view').style.display='flex'; document.getElementById('map-view').style.display='none'; currentMap=null; document.getElementById('fab-add').style.display='none'; } 
        else { currentMap=maps.find(m=>m.id===s.mapId); document.getElementById('home-view').style.display='none'; document.getElementById('map-view').style.display='flex'; document.getElementById('map-title').textContent=currentMap.name; document.getElementById('dust2-map').src=currentMap.radar; document.getElementById('fab-add').style.display='flex'; tx=s.tx; ty=s.ty; scale=s.scale; applyTransform(); updateLayerVisibility(); }
        if(s.isAiming) { isAiming=true; aimMode=s.aimMode; tempPoint={...s.tempPoint}; tempPath=[...s.tempPath]; document.getElementById('aim-overlay').style.display='flex'; document.getElementById('fab-add').style.display='none'; toggleAimControls(); updateTrajectories(); updateAimRadiusCircle(); }
        if(s.isDetailOpen&&s.detailId) { const i=allUtilities[currentMap?.id]?.find(u=>u.id===s.detailId); if(i) showUtilityDetails(i,false); }
        if(s.isFormOpen) document.getElementById('modal-add').style.display='flex';
    }

    function executeBackAction() {
        const dd=document.getElementById('global-search-dropdown'); const gInput=document.getElementById('global-search');

        if(document.getElementById('fullscreen-viewer').style.display==='flex') { document.getElementById('btn-fs-close').click(); return; }
        if(document.getElementById('modal-export').style.display==='flex') { document.getElementById('modal-export').style.display='none'; return; }
        if(document.getElementById('modal-add').style.display==='flex') { forwardStack.push(createUIStateSnapshot()); document.getElementById('modal-add').style.display='none'; editingTrajectoryId=null; if(currentMap) document.getElementById('fab-add').style.display='flex'; } 
        else if(document.getElementById('modal-detail').style.display==='flex') { forwardStack.push(createUIStateSnapshot()); const did=document.getElementById('modal-detail').dataset.itemId; document.getElementById('modal-detail').style.display='none'; triggerMapPingAnimation(did); } 
        else if(isAiming) { forwardStack.push(createUIStateSnapshot()); isAiming=false; document.getElementById('aim-overlay').style.display='none'; editingTrajectoryId=null; if(currentMap) document.getElementById('fab-add').style.display='flex'; if(aimMode==='path') document.getElementById('modal-add').style.display='flex'; updateTrajectories(); updateAimRadiusCircle(); } 
        else if(currentMap) { forwardStack.push(createUIStateSnapshot()); document.getElementById('home-view').style.display='flex'; document.getElementById('map-view').style.display='none'; currentMap=null; touchHoveredId=null; }
    }

    function executeForwardAction() { if(forwardStack.length>0) restoreUIState(forwardStack.pop()); }

    function setupHotkeys() {

            if(e.altKey&&e.key==='ArrowLeft') { e.preventDefault(); executeBackAction(); return; } if(e.altKey&&e.key==='ArrowRight') { e.preventDefault(); executeForwardAction(); return; }

        });

    function buildMapDOM() {

    function updateLayerVisibility() {

        const types=Array.from(document.querySelectorAll('#type-checkboxes input:checked')).map(cb=>cb.value);
        const st=document.getElementById('filter-throw').checked; const sl=document.getElementById('filter-land').checked;
        const rawQ=document.getElementById('local-search').value.toLowerCase(); const sf=document.getElementById('filter-fav').checked;
        const auth=(item)=>{ if(!types.includes(item.type)) return false; if(sf&&!item.isFavorite) return false; if(rawQ&&!item.name.toLowerCase().includes(rawQ)&&!item.tags?.some(t=>t.toLowerCase().includes(rawQ))) return false; return true; };
        document.querySelectorAll('.list-item').forEach(el => { const item=allUtilities[currentMap.id].find(u=>u.id===el.dataset.id); el.style.display=auth(item)?'flex':'none'; });
        
        document.querySelectorAll('.point-wrapper.t-pt').forEach(el => { 
            const item=allUtilities[currentMap.id].find(u=>u.id===el.dataset.id); if(!item) return; 
            const isHov=(hoveredItemId===item.id || touchHoveredId===item.id);
            if(editingTrajectoryId && item.id!==editingTrajectoryId) { el.style.display='none'; el.classList.remove('touch-hovered'); return; }
            el.style.display=auth(item)&&(st||isHov)?'block':'none'; 
            el.style.zIndex=isHov?'30':'10'; 
            el.classList.toggle('touch-hovered', touchHoveredId===item.id);
        });
        
        document.querySelectorAll('.land-wrapper.l-pt').forEach(el => { 
            const item=allUtilities[currentMap.id].find(u=>u.id===el.dataset.id); if(!item) return; 
            const isHov=(hoveredItemId===item.id || touchHoveredId===item.id);
            if(editingTrajectoryId && item.id!==editingTrajectoryId) { el.style.display='none'; el.classList.remove('touch-hovered'); return; }
            el.style.display=auth(item)&&(sl||isHov)?'block':'none'; 
            el.style.zIndex=isHov?'20':'8'; 
            el.classList.toggle('touch-hovered', touchHoveredId===item.id);
        });
        updateTrajectories();
    }

    function updateTrajectories() {
        if(!currentMap) return; const svg=document.getElementById('trajectory-layer'); svg.innerHTML='';
        const img=document.getElementById('dust2-map'); const w=img.clientWidth||img.naturalWidth; const h=img.clientHeight||img.naturalHeight; if(!w||!h) return;
        const types=Array.from(document.querySelectorAll('#type-checkboxes input:checked')).map(cb=>cb.value);
        const sf=document.getElementById('filter-fav').checked; const rawQ=document.getElementById('local-search').value.toLowerCase(); const sTr=document.getElementById('filter-trajectory').checked;
        const auth=(item)=>{ if(!types.includes(item.type)) return false; if(sf&&!item.isFavorite) return false; if(rawQ&&!item.name.toLowerCase().includes(rawQ)&&!item.tags?.some(t=>t.toLowerCase().includes(rawQ))) return false; return true; };
        (allUtilities[currentMap.id]||[]).forEach(u => {
            if(!u.trajectory?.points?.length) return; const isHovered=(u.id===hoveredItemId || u.id===touchHoveredId);
            if(editingTrajectoryId && u.id!==editingTrajectoryId) return;
            if(!auth(u)) return; if(!sTr&&!isHovered) return;
            const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','traj-group');
            const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
            const pts=[{x:u.x,y:u.y},...u.trajectory.points].map(p=>`${(p.x/100)*w},${(p.y/100)*h}`).join(' ');
            poly.setAttribute('points',pts); poly.setAttribute('stroke',u.color||DEFAULT_COLORS[u.type]); poly.setAttribute('vector-effect','non-scaling-stroke'); poly.style.strokeWidth='2.5px'; poly.style.fill='none'; poly.style.strokeDasharray='5,5'; g.appendChild(poly);
            const radiusRatio=currentMap.effectRadius?.[u.type]||0; const showLand=document.getElementById('filter-land').checked||isHovered;
            if(radiusRatio>0&&showLand) { const lp=u.trajectory.points[u.trajectory.points.length-1]; const circle=document.createElementNS('http://www.w3.org/2000/svg','circle'); circle.setAttribute('cx',(lp.x/100)*w); circle.setAttribute('cy',(lp.y/100)*h); circle.setAttribute('r',w*radiusRatio); circle.style.fill=`${u.color||DEFAULT_COLORS[u.type]}33`; circle.style.stroke=u.color||DEFAULT_COLORS[u.type]; circle.style.strokeWidth='2px'; circle.style.vectorEffect='non-scaling-stroke'; g.appendChild(circle); }
            svg.appendChild(g); requestAnimationFrame(()=>g.classList.add('show'));
        });
        if(isAiming&&aimMode==='path') {
            const mc=document.getElementById('map-container'); const cx=mc.clientWidth/2, cy=mc.clientHeight/2;
            const mx=(((cx-tx)/scale)/w)*100; const my=(((cy-ty)/scale)/h)*100;
            const dynG=document.createElementNS('http://www.w3.org/2000/svg','g');
            if(tempPath.length>0) { const sPoly=document.createElementNS('http://www.w3.org/2000/svg','polyline'); const sPts=[{x:tempPoint.x,y:tempPoint.y},...tempPath].map(p=>`${(p.x/100)*w},${(p.y/100)*h}`).join(' '); sPoly.setAttribute('points',sPts); sPoly.setAttribute('vector-effect','non-scaling-stroke'); sPoly.style.stroke='#fff'; sPoly.style.strokeWidth='2.5px'; sPoly.style.fill='none'; dynG.appendChild(sPoly); }
            const lastPt=tempPath.length>0?tempPath[tempPath.length-1]:tempPoint;
            const dLine=document.createElementNS('http://www.w3.org/2000/svg','line'); dLine.setAttribute('x1',(lastPt.x/100)*w); dLine.setAttribute('y1',(lastPt.y/100)*h); dLine.setAttribute('x2',(mx/100)*w); dLine.setAttribute('y2',(my/100)*h); dLine.style.stroke='#fff'; dLine.style.strokeWidth='2.5px'; dLine.style.strokeDasharray='5,5'; dLine.setAttribute('vector-effect','non-scaling-stroke'); dynG.appendChild(dLine);
            [{x:tempPoint.x,y:tempPoint.y},...tempPath].forEach((p,idx)=>{ const anc=document.createElementNS('http://www.w3.org/2000/svg','circle'); anc.setAttribute('cx',(p.x/100)*w); anc.setAttribute('cy',(p.y/100)*h); anc.setAttribute('r',(5/scale)+'px'); anc.style.fill=idx===0?'#FF9800':'#fff'; dynG.appendChild(anc); });
            svg.appendChild(dynG);
        }
    }

    function setupMapEngine() {
        const mc=document.getElementById('map-container');
        mc.addEventListener('wheel', e => { e.preventDefault(); const r=mc.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; const newScale=Math.min(Math.max(scale*(e.deltaY<0?1.15:0.85),0.15),10); const ratio=newScale/scale; tx=mx-(mx-tx)*ratio; ty=my-(my-ty)*ratio; scale=newScale; applyTransform(); }, {passive:false});
        
        // ✅ Bug1：移除 !isAiming 限制，允许在选点/编辑轨迹时拖拽地图
        mc.addEventListener('mousedown', e => { 
            if(e.button===0){ 
                dragStartX=e.clientX; dragStartY=e.clientY; 
                isDragging=true; hasDragged=false; 
                mc.classList.add('grabbing'); 
            }
        });
        window.addEventListener('mousemove', e => { 
            if(isDragging){ 
                if(Math.abs(e.clientX-dragStartX)>2) hasDragged=true; 
                if(hasDragged){ tx+=e.movementX; ty+=e.movementY; applyTransform(); }
            } 
            if(isAiming&&aimMode==='path') updateTrajectories(); 
        });
        window.addEventListener('mouseup', () => { isDragging=false; mc.classList.remove('grabbing'); });

        let touchStartDist = 0, touchStartScale = 1, touchStartTx = 0, touchStartTy = 0, touchStartMidX = 0, touchStartMidY = 0;
        let singleTouchStartX = 0, singleTouchStartY = 0;
        
        mc.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDist = Math.hypot(dx, dy);
                touchStartScale = scale;
                touchStartTx = tx; touchStartTy = ty;
                const r = mc.getBoundingClientRect();
                touchStartMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
                touchStartMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
            } else if (e.touches.length === 1) { // ✅ Bug1：移除 !isAiming 限制
                singleTouchStartX = e.touches[0].clientX;
                singleTouchStartY = e.touches[0].clientY;
                singleTouchMoved = false;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                isDragging = true; hasDragged = false;
            }
        }, { passive: false });

        mc.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const newScale = Math.min(Math.max(touchStartScale * (dist / touchStartDist), 0.15), 10);
                const ratio = newScale / touchStartScale;
                tx = touchStartMidX - (touchStartMidX - touchStartTx) * ratio;
                ty = touchStartMidY - (touchStartMidY - touchStartTy) * ratio;
                scale = newScale;
                applyTransform();
            } else if (e.touches.length === 1 && isDragging) { // ✅ Bug1：移除 !isAiming 限制
                const dx = e.touches[0].clientX - singleTouchStartX;
                const dy = e.touches[0].clientY - singleTouchStartY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) { singleTouchMoved = true; hasDragged = true; }
                if (hasDragged) { tx += e.touches[0].clientX - dragStartX; ty += e.touches[0].clientY - dragStartY; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; applyTransform(); }
            }
            if (isAiming && aimMode === 'path') updateTrajectories();
        }, { passive: false });

        mc.addEventListener('touchend', (e) => { isDragging = false; mc.classList.remove('grabbing'); });

        // ✅ Bug3：点击地图空白处取消移动端 Hover
        mc.addEventListener('click', (e) => {
            if (isAiming) return;
            if (isTouchDevice) {
                if (singleTouchMoved) return; // 拖拽地图不触发取消
                if (touchHoveredId) {
                    touchHoveredId = null;
                    updateLayerVisibility();
                }
            }
        });

        document.getElementById('fab-add').onclick = () => { isAiming=true; aimMode='throw'; toggleAimControls(); document.getElementById('aim-overlay').style.display='flex'; document.getElementById('fab-add').style.display='none'; updateAimRadiusCircle(); };
        document.getElementById('aim-confirm').onclick = () => { const r=mc.getBoundingClientRect(); const img=document.getElementById('dust2-map'); tempPoint.x=((((r.width/2)-tx)/scale)/img.naturalWidth)*100; tempPoint.y=((((r.height/2)-ty)/scale)/img.naturalHeight)*100; tempPath=[]; openAddModal(null); };
        document.getElementById('aim-path-add').onclick = (e) => { e.stopPropagation(); const r=mc.getBoundingClientRect(); const img=document.getElementById('dust2-map'); tempPath.push({x:((((r.width/2)-tx)/scale)/img.naturalWidth)*100, y:((((r.height/2)-ty)/scale)/img.naturalHeight)*100}); updateTrajectories(); updatePathStatusText(); };
        
        // ✅ Bug2：修复重设轨迹按钮
        document.getElementById('aim-path-reset').onclick = (e) => { 
            e.stopPropagation(); 
            tempPath = []; 
            updateTrajectories(); 
            updatePathStatusText(); 
        };
        
        document.getElementById('aim-path-confirm').onclick = () => { const r=mc.getBoundingClientRect(); const img=document.getElementById('dust2-map'); tempPath.push({x:((((r.width/2)-tx)/scale)/img.naturalWidth)*100, y:((((r.height/2)-ty)/scale)/img.naturalHeight)*100}); document.getElementById('aim-overlay').style.display='none'; document.getElementById('modal-add').style.display='flex'; isAiming=false; editingTrajectoryId=null; updateTrajectories(); updatePathStatusText(); updateAimRadiusCircle(); updateLayerVisibility(); };
    }

    function applyTransform() { document.getElementById('map-wrapper').style.transform=`translate(${tx}px, ${ty}px) scale(${scale})`; updateTrajectories(); updateAimRadiusCircle(); }
    
    function toggleAimControls() {
        if(aimMode==='throw') { document.getElementById('aim-hint-text').textContent="🎯 拖动缩放对准坐标点，按 [Enter] 确认"; document.getElementById('aim-controls-standard').style.display='flex'; document.getElementById('aim-controls-path').style.display='none'; } 
        else { document.getElementById('aim-hint-text').textContent="〰️ 对准位置点击[添加锚点]，最后指向落点点击[完成]"; document.getElementById('aim-controls-standard').style.display='none'; document.getElementById('aim-controls-path').style.display='flex'; }
        updateAimRadiusCircle();
    }

    function updateAimRadiusCircle() {
        const circleEl=document.getElementById('aim-radius-circle');
        if(!currentMap||!isAiming||(aimMode!=='land'&&aimMode!=='path')) { circleEl.style.display='none'; return; }
        const type=document.querySelector('input[name="utype"]:checked')?.value||'smoke';
        const ratio=currentMap.effectRadius?.[type]||0; if(ratio<=0) { circleEl.style.display='none'; return; }
        const img=document.getElementById('dust2-map'); const diameterPx=img.naturalWidth*ratio*scale*2;
        circleEl.style.width=diameterPx+'px'; circleEl.style.height=diameterPx+'px'; circleEl.style.display='block';
    }

    function setupFormInteraction() {
        const helper=document.getElementById('input-tag-helper');
        helper.addEventListener('keydown', (e) => { if(e.key==='Enter') { e.preventDefault(); e.stopPropagation(); const v=helper.value.trim(); if(v&&!activeTags.includes(v)) { activeTags.push(v); renderFormTags(); } helper.value=''; } });
        ['lineup','throw','effect'].forEach(bType => {
            const inp=document.getElementById(`finput-${bType}`); inp.onchange=e=>handleFormImageFiles(e.target.files,bType);
            const sec=document.querySelector(`.bucket-section[data-bucket="${bType}"]`);
            sec.addEventListener('dragenter',e=>{e.preventDefault();e.stopPropagation();}); sec.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();sec.style.borderColor='var(--accent-color)';}); sec.addEventListener('dragleave',e=>{e.preventDefault();e.stopPropagation();sec.style.borderColor='var(--border-color)';}); sec.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();sec.style.borderColor='var(--border-color)';handleFormImageFiles(e.dataTransfer.files,bType);});
        });
        const vidSec=document.querySelector('[data-bucket="video"]');
        if(vidSec) { vidSec.addEventListener('dragenter',e=>{e.preventDefault();e.stopPropagation();}); vidSec.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();vidSec.style.borderColor='var(--accent-color)';}); vidSec.addEventListener('dragleave',e=>{e.preventDefault();e.stopPropagation();vidSec.style.borderColor='var(--border-color)';}); vidSec.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();vidSec.style.borderColor='var(--border-color)';const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('video/')){const r=new FileReader();document.getElementById('video-preview-status').textContent="转码中...";r.onload=ev=>{formVideoBase64=ev.target.result;document.getElementById('video-preview-status').textContent=`✅ 视频就绪`;};r.readAsDataURL(f);} }); }
        document.getElementById('input-video').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();document.getElementById('video-preview-status').textContent="转码中...";r.onload=ev=>{formVideoBase64=ev.target.result;document.getElementById('video-preview-status').textContent=`✅ 视频就绪`;};r.readAsDataURL(f);};
        document.getElementById('btn-edit-path').onclick=()=>{
            document.getElementById('modal-add').style.display='none'; isAiming=true; aimMode='path';
            editingTrajectoryId = document.getElementById('edit-id').value || null;
            if(tempPath.length===0) tempPath=[];
            toggleAimControls(); document.getElementById('aim-overlay').style.display='flex';
            updateTrajectories(); updateAimRadiusCircle(); updateLayerVisibility();
        };
        document.getElementById('btn-form-submit').onclick=()=>document.getElementById('form-utility').dispatchEvent(new Event('submit'));
        document.getElementById('form-utility').onsubmit=(e)=>{
            e.preventDefault(); if(!currentMap) return; const eid=document.getElementById('edit-id').value;
            const uData={ id:eid||Date.now().toString(), name:document.getElementById('input-name').value.trim(), desc:document.getElementById('input-desc').value.trim(), type:document.querySelector('input[name="utype"]:checked').value, color:document.getElementById('input-color').value, tags:[...activeTags], buckets:formBuckets, video:formVideoBase64, x:tempPoint.x, y:tempPoint.y, trajectory:tempPath.length>0?{points:[...tempPath]}:null, isFavorite:eid?(allUtilities[currentMap.id].find(u=>u.id===eid)?.isFavorite||false):false };
            if(eid){const i=allUtilities[currentMap.id].findIndex(u=>u.id===eid);if(i!==-1)allUtilities[currentMap.id][i]=uData;} else allUtilities[currentMap.id].push(uData);
            forwardStack.length=0; document.getElementById('modal-add').style.display='none'; isAiming=false; editingTrajectoryId=null; document.getElementById('aim-overlay').style.display='none'; document.getElementById('fab-add').style.display='flex'; buildMapDOM(); updateAimRadiusCircle();
        };
    }

    function handleFormImageFiles(files,bType) { Array.from(files).forEach(f=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>{formBuckets[bType].push(e.target.result);renderFormBucketImages(bType);};r.readAsDataURL(f);}); }
    function renderFormBucketImages(bType) { const grid=document.getElementById(`grid-${bType}`); grid.innerHTML=''; formBuckets[bType].forEach((b64,idx)=>{const w=document.createElement('div');w.className=`img-slot ${idx===0?'is-main':''}`;w.draggable=true;w.style.backgroundImage=`url(${b64})`;w.innerHTML=`<button type="button" class="del-img">&times;</button>`;w.querySelector('.del-img').onclick=e=>{e.stopPropagation();formBuckets[bType].splice(idx,1);renderFormBucketImages(bType);};w.ondragstart=e=>{e.dataTransfer.setData('text/plain',idx);w.style.opacity='0.5';};w.ondragend=()=>w.style.opacity='1';w.ondragover=e=>e.preventDefault();w.ondrop=e=>{e.preventDefault();const from=parseInt(e.dataTransfer.getData('text/plain'),10);const item=formBuckets[bType].splice(from,1)[0];formBuckets[bType].splice(idx,0,item);renderFormBucketImages(bType);};grid.appendChild(w);}); }
    function renderFormTags() { const wrap=document.getElementById('tag-box-wrapper');const helper=document.getElementById('input-tag-helper');wrap.querySelectorAll('.tag-capsule').forEach(e=>e.remove());activeTags.forEach((t,i)=>{const c=document.createElement('div');c.className='tag-capsule';c.innerHTML=`<span>${t}</span><span class="tag-close">&times;</span>`;c.querySelector('.tag-close').onclick=()=>{activeTags.splice(i,1);renderFormTags();};wrap.insertBefore(c,helper);}); }
    function updatePathStatusText() { const txt=document.getElementById('path-status-text'); if(tempPath.length>0) txt.innerHTML=`✅ 已设定轨迹，共 <b>${tempPath.length}</b> 个锚点（含落点）。`; else txt.innerHTML=`暂无轨迹。`; }

    function openAddModal(item) {
        document.getElementById('form-utility').reset();
        activeTags=[]; formBuckets={lineup:[],throw:[],effect:[]}; formVideoBase64=null;
        document.getElementById('video-preview-status').textContent="";
        document.getElementById('finput-lineup').value=''; document.getElementById('finput-throw').value=''; document.getElementById('finput-effect').value='';
        if(item) {
            document.getElementById('modal-form-title').textContent="编辑战术道具"; document.getElementById('edit-id').value=item.id;
            document.getElementById('input-name').value=item.name; document.getElementById('input-desc').value=item.desc||'';
            document.getElementById('input-color').value=item.color||DEFAULT_COLORS[item.type]; document.querySelector(`input[name="utype"][value="${item.type}"]`).checked=true;
            activeTags=item.tags?[...item.tags]:[]; if(item.buckets) formBuckets=JSON.parse(JSON.stringify(item.buckets));
            formVideoBase64=item.video||null; if(formVideoBase64) document.getElementById('video-preview-status').textContent="⏳ 视频保留中";
            if(item.trajectory) tempPath=[...item.trajectory.points]; else tempPath=[];
            tempPoint = { x: item.x, y: item.y };
        } else {
            document.getElementById('edit-id').value=""; document.getElementById('input-color').value=DEFAULT_COLORS.smoke; tempPath=[];
        }
        renderFormTags(); ['lineup','throw','effect'].forEach(renderFormBucketImages); updatePathStatusText();
        document.getElementById('modal-detail').style.display='none'; document.getElementById('modal-add').style.display='flex';
        updateAimRadiusCircle();
    }

    let currentDetailState={lineup:0,throw:0,effect:0};
    function showUtilityDetails(item, pushHistory=true) {
        if(pushHistory) forwardStack.length=0;
        document.getElementById('modal-detail').dataset.itemId=item.id;
        document.getElementById('detail-name').textContent=item.name; document.getElementById('detail-desc').textContent=item.desc||'暂无描述。';
        const favBtn=document.getElementById('btn-detail-fav'); favBtn.innerHTML=item.isFavorite?'★ 取消收藏':'☆ 收藏'; favBtn.className=`btn-action-fav ${item.isFavorite?'is-fav':''}`;
        favBtn.onclick=()=>{item.isFavorite=!item.isFavorite; buildMapDOM(); showUtilityDetails(item,false);};
        document.getElementById('btn-edit-current').onclick=()=>{document.getElementById('modal-detail').style.display='none'; openAddModal(item);};
        document.getElementById('btn-delete-current').onclick=()=>{if(confirm(`确定要删除【${item.name}】吗？此操作不可逆。`)){allUtilities[currentMap.id]=allUtilities[currentMap.id].filter(u=>u.id!==item.id);document.getElementById('modal-detail').style.display='none';buildMapDOM();}};
        const tWrap=document.getElementById('detail-tags-list'); tWrap.innerHTML=''; (item.tags||[]).forEach(t=>{const s=document.createElement('span');s.className='tag-capsule';s.textContent=t;tWrap.appendChild(s);});
        if(item.video){document.getElementById('detail-video-container').style.display='block';document.getElementById('detail-video').src=item.video;} else {document.getElementById('detail-video-container').style.display='none';document.getElementById('detail-video').src='';}
        ['lineup','throw','effect'].forEach(bt=>{
            const sec=document.getElementById(`sec-detail-${bt}`);const tw=document.getElementById(`thumbs-detail-${bt}`);const mainImg=document.getElementById(`main-detail-${bt}`);
            const btnL=document.getElementById(`nav-l-${bt}`);const btnR=document.getElementById(`nav-r-${bt}`);
            tw.innerHTML=''; const imgs=item.buckets?.[bt]||[]; currentDetailState[bt]=0;
            if(!imgs.length){sec.style.display='none';} else {
                sec.style.display='block';
                const updateView=(idx)=>{currentDetailState[bt]=idx;mainImg.src=imgs[idx];sec.querySelectorAll('.thumb-item').forEach((el,i)=>el.classList.toggle('active',i===idx));btnL.disabled=(idx===0);btnR.disabled=(idx===imgs.length-1);btnL.style.display=imgs.length>1?'block':'none';btnR.style.display=imgs.length>1?'block':'none';};
                imgs.forEach((b,i)=>{const ti=document.createElement('div');ti.className=`thumb-item ${i===0?'is-main':''}`;ti.innerHTML=`<img src="${b}">`;ti.onclick=()=>updateView(i);tw.appendChild(ti);});
                btnL.onclick=()=>{if(currentDetailState[bt]>0)updateView(currentDetailState[bt]-1);};
                btnR.onclick=()=>{if(currentDetailState[bt]<imgs.length-1)updateView(currentDetailState[bt]+1);};
                mainImg.onclick=()=>openFullscreen(mainImg.src); updateView(0);
            }
        });
        document.getElementById('modal-detail').style.display='flex';
    }

    function setupDetailSwipe() {
        document.querySelectorAll('.detail-media-box[data-swipe]').forEach(box => {
            const cat = box.dataset.swipe;
            box.addEventListener('touchstart', (e) => { detailSwipeState.startX = e.touches[0].clientX; detailSwipeState.startY = e.touches[0].clientY; detailSwipeState.cat = cat; }, { passive: true });
            box.addEventListener('touchend', (e) => {
                if (detailSwipeState.cat !== cat) return;
                const dx = e.changedTouches[0].clientX - detailSwipeState.startX;
                const dy = e.changedTouches[0].clientY - detailSwipeState.startY;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    const btnL = document.getElementById(`nav-l-${cat}`);
                    const btnR = document.getElementById(`nav-r-${cat}`);
                    if (dx < 0 && !btnR.disabled) btnR.click();
                    else if (dx > 0 && !btnL.disabled) btnL.click();
                }
            }, { passive: true });
        });
    }

    let fsScale=1;let fsTx=0;let fsTy=0;let fsDragging=false;let fsStartX,fsStartY;
    function setupFullscreenViewer() {
        const v=document.getElementById('fullscreen-viewer');const img=document.getElementById('fullscreen-img');
        document.getElementById('btn-fs-close').onclick=()=>v.style.display='none';
        v.addEventListener('wheel',e=>{e.preventDefault();fsScale=Math.min(Math.max(fsScale*(e.deltaY<0?1.2:0.8),0.5),10);img.style.transform=`translate(${fsTx}px,${fsTy}px) scale(${fsScale})`;});
        v.addEventListener('mousedown',e=>{if(e.target===v||e.target===document.getElementById('btn-fs-close'))return;fsStartX=e.clientX-fsTx;fsStartY=e.clientY-fsTy;fsDragging=true;});
        window.addEventListener('mousemove',e=>{if(fsDragging){fsTx=e.clientX-fsStartX;fsTy=e.clientY-fsStartY;img.style.transform=`translate(${fsTx}px,${fsTy}px) scale(${fsScale})`;}});
        window.addEventListener('mouseup',()=>fsDragging=false);
    }
    function openFullscreen(src) { fsScale=1;fsTx=0;fsTy=0;const img=document.getElementById('fullscreen-img');img.src=src;img.style.transform='translate(0px,0px) scale(1)';document.getElementById('fullscreen-viewer').style.display='flex'; }

    init();
</script>
</body>
